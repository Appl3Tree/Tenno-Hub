# ──────────────────────────────────────────────────────────────────────────────
# Deploy to GitHub Pages
#
# Triggers on every push to the main branch.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # TypeScript's default heap limit is too small for the current project graph.
          NODE_OPTIONS: --max-old-space-size=4096
          # Repository variable — safe to expose, not a secret.
          # See the comment at the top of the file for setup instructions.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # The public Actions REST artifact list can update before the internal
      # ArtifactService queried by deploy-pages@v4. Require three consecutive
      # five-second-spaced listings so both indexes have time to settle.
      - name: Wait for Pages artifact indexes to settle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          consecutive_visible=0
          for attempt in $(seq 1 15); do
            artifact_count=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')

            if [ "$artifact_count" -eq 1 ]; then
              consecutive_visible=$((consecutive_visible + 1))
              echo "GitHub lists one github-pages artifact ($consecutive_visible/3 consecutive checks)."
              if [ "$consecutive_visible" -ge 3 ]; then
                echo "Artifact metadata remained visible for 10 seconds."
                exit 0
              fi
            elif [ "$artifact_count" -gt 1 ]; then
              echo "::error::Expected one github-pages artifact, found $artifact_count."
              exit 1
            else
              consecutive_visible=0
              if [ "$attempt" -lt 15 ]; then
                echo "Pages artifact metadata is not visible yet (attempt $attempt/15); retrying in 5 seconds."
              else
                echo "Pages artifact metadata is still not visible on the last attempt (15/15)."
              fi
            fi

            if [ "$attempt" -lt 15 ]; then sleep 5; fi
          done

          echo "::error::github-pages artifact metadata did not remain stable for three checks within 70 seconds."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# ──────────────────────────────────────────────────────────────────────────────
# Deploy to GitHub Pages
#
# Triggers on every push to the main branch.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # TypeScript's default heap limit is too small for the current project graph.
          NODE_OPTIONS: --max-old-space-size=4096
          # Repository variable — safe to expose, not a secret.
          # See the comment at the top of the file for setup instructions.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Artifact contents can upload before the workflow-run artifact API lists
      # them. deploy-pages queries that API immediately, so wait for its index
      # to expose exactly one fresh Pages artifact before starting deployment.
      - name: Wait for Pages artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            artifact_count=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')

            if [ "$artifact_count" -eq 1 ]; then
              echo "GitHub lists exactly one available github-pages artifact."
              exit 0
            fi

            if [ "$artifact_count" -gt 1 ]; then
              echo "::error::Expected one github-pages artifact, found $artifact_count."
              exit 1
            fi

            echo "Pages artifact metadata is not visible yet (attempt $attempt/12); retrying in 5 seconds."
            sleep 5
          done

          echo "::error::github-pages artifact metadata stayed unavailable for 60 seconds."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
